
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120" fill="none">
    <defs>
        <linearGradient id="selopiaPurple" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7C3AED"/>
            <stop offset="100%" stop-color="#4C1D95"/>
        </linearGradient>
    </defs>

    <!-- Calendar Icon -->
    <g transform="translate(8 15)">
        <rect x="4" y="12" width="66" height="68" rx="15"
              stroke="url(#selopiaPurple)" stroke-width="5"/>

        <!-- Calendar Header -->
        <path d="M4 30H70" stroke="#7C3AED" stroke-width="5"/>
        <path d="M20 3V21 M54 3V21"
              stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>

        <!-- Calendar Dots -->
        <g fill="#C4B5FD">
            <rect x="15" y="40" width="10" height="10" rx="3"/>
            <rect x="32" y="40" width="10" height="10" rx="3"/>
            <rect x="49" y="40" width="10" height="10" rx="3"/>
            <rect x="15" y="57" width="10" height="10" rx="3"/>
            <rect x="32" y="57" width="10" height="10" rx="3"/>
        </g>

        <!-- Approval Badge -->
        <circle cx="59" cy="68" r="22" fill="#6D28D9"/>
        <path d="M49 68L56 75L70 61"
              stroke="white" stroke-width="4"
              stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Leaf -->
        <path d="M75 5C92 3 104 10 104 10C102 26 90 36 76 34C69 26 69 15 75 5Z"
              fill="#22C55E"/>
        <path d="M76 33L91 14"
              stroke="#15803D" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Brand Name -->
    <text x="125" y="65"
          font-family="Inter, Arial, sans-serif"
          font-size="43" font-weight="750"
          fill="#4C1D95">
        Selopia
    </text>

    <!-- Leave Text -->
    <text x="128" y="92"
          font-family="Inter, Arial, sans-serif"
          font-size="21" font-weight="500"
          letter-spacing="5"
          fill="#7C3AED">
        LEAVE
    </text>

    <!-- Decorative Lines -->
    <path d="M235 83H265 M315 83H345"
          stroke="#C4B5FD" stroke-width="2.5" stroke-linecap="round"/>
</svg>
